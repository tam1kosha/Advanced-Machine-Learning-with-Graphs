# MVP experiment config (proposal §5).
# All dates are UTC, half-open intervals [start, end).
data:
  hf_repo: vgregoire/polymarket-users
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

splits:
  train:                      # cutoff 1: fit models here
    graph_start: "2024-07-01"
    cutoff:      "2025-01-01"
    label_end:   "2025-07-01"
  test:                       # cutoff 2: out-of-time evaluation
    graph_start: "2025-01-01"
    cutoff:      "2025-07-01"
    label_end:   "2026-01-01"

labels:
  min_resolved_bets: 30       # wallets below this get no label
  fdr_alpha: 0.10             # Benjamini–Hochberg level for the skill test
  n_sim: 2000                 # Monte Carlo draws per wallet for the null
  calib_bins: 100             # price bins for the favourite–longshot calibration
  bet_unit: market            # market | event: one bet per (wallet, market) or per (wallet, event_id);
                              # event = sibling markets averaged, comonotone null (labels.py docstring)

cleaning:
  drop_self_trades: true      # maker == taker
  min_price: 0.001            # drop degenerate fills
  max_price: 0.999

graph:
  min_edge_trades: 1          # keep a (taker, maker) pair if it traded at least this often
  moved_first_window_min: 60  # derived edge u->v if v makes the same bet <= this many minutes after u
  moved_first_max_leaders: 10 # only the <= 10 entries just before v's (raw pairs within 60 min: 497M)
  moved_first_min_count: 2    # frozen graph: keep a (u, v) pair if it co-moves in >= 2 market-sides

first_k:                      # iteration 2: inductive "first k fills" setting (scripts 07-09)
  populations: [new, existing]  # new = no fill in the graph window; existing = has a pre-cutoff node
  label_after: k              # k: label = bets strictly after the k-th post-cutoff fill, in markets not in the
                              #    observed history (population changes with k);
                              # kmax: after the max(k_buckets)-th fill for every k (fixed population, ~2x smaller)
  subsample: 1.0              # fraction of eligible wallets kept (1.0 = all; state the fraction if < 1)

gnn:                          # sampled (Hetero)GraphSAGE for the first-k experiments (scripts 09)
  hidden: 64
  fanout: [10, 5]             # in-neighbours sampled per relation at hop 1 / hop 2 (with replacement)
  batch: 1024
  epochs: 40
  patience: 6                 # epochs without val-AUPRC gain
  lr: 0.003
  eval_reps: 3                # neighbour samples averaged at inference
  threads: 2
  gpu_scale: false            # true: larger fan-out / hidden / epochs (set them above) on a GPU box

eval:
  seeds: [0, 1, 2, 3, 4]
  k_buckets: [1, 3, 5, 10, 20, 50]   # pre-cutoff trade-count buckets for the detection curve
