# MVP experiment config (proposal §5).
# All dates are UTC, half-open intervals [start, end).
data:
  hf_repo: vgregoire/polymarket-users
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

splits:
  train:                      # cutoff 1: fit models here
    graph_start: "2024-07-01"
    cutoff:      "2025-01-01"
    label_end:   "2025-07-01"
  test:                       # cutoff 2: out-of-time evaluation
    graph_start: "2025-01-01"
    cutoff:      "2025-07-01"
    label_end:   "2026-01-01"

labels:
  min_resolved_bets: 30       # wallets below this get no label
  fdr_alpha: 0.10             # Benjamini–Hochberg level for the skill test
  n_sim: 2000                 # Monte Carlo draws per wallet for the null
  calib_bins: 100             # price bins for the favourite–longshot calibration

cleaning:
  drop_self_trades: true      # maker == taker
  min_price: 0.001            # drop degenerate fills
  max_price: 0.999

graph:
  min_edge_trades: 1          # keep a (taker, maker) pair if it traded at least this often
  moved_first_window_min: 60  # derived edge u->v if v makes the same bet <= this many minutes after u

eval:
  seeds: [0, 1, 2, 3, 4]
  k_buckets: [1, 3, 5, 10, 20, 50]   # pre-cutoff trade-count buckets for the detection curve
