[project]
name = "pmgraph"
version = "0.1.0"
description = "Skilled or Lucky? Early trader typing on Polymarket trading graphs (COMP 5222)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "pandas>=2.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm",
  "huggingface_hub>=0.24",
  "torch>=2.3",
  "torch_geometric>=2.5",
]

[project.optional-dependencies]
community = ["igraph", "leidenalg"]
# On a CUDA box, also install the PyG extensions for node2vec / TGN random walks:
#   pip install pyg_lib torch_scatter torch_sparse torch_cluster -f https://data.pyg.org/whl/torch-${TORCH}+${CUDA}.html
dev = ["pytest", "ruff", "jupyterlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
